<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Absensi Daurah Pembina GSD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin:0; font-family:'Segoe UI', Roboto, Arial, sans-serif; background:#fff; color:#0f172a; text-align:center; }
  .wrap { max-width:560px; margin:0 auto; padding:28px 20px; }
  .kecil { font-size:14px; letter-spacing:2px; text-transform:uppercase; color:#0f766e; }
  h1 { margin:8px 0 4px; font-size:28px; color:#115e59; line-height:1.3; }
  p { color:#475569; font-size:16px; }
  #qr { display:inline-block; padding:18px; border:4px solid #0f766e; border-radius:20px; margin:20px 0 10px; background:#fff; }
  #qr img, #qr canvas { display:block; }
  .url { font-size:12px; color:#94a3b8; word-break:break-all; }
  button { margin-top:18px; padding:12px 28px; font-size:16px; font-weight:700; color:#fff; background:#0f766e; border:none; border-radius:10px; cursor:pointer; }
  @media print { button, .url { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="kecil">Absensi Peserta</div>
  <h1>Daurah Pembina<br>Gerakan Sejuta Dai (GSD)</h1>
  <p>Scan QR ini dengan kamera HP,<br>lalu masukkan nomor WhatsApp Anda.</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <button onclick="window.print()">Cetak / Simpan PDF</button>
</div>

<script>
  // Kode rahasia acara. Harus SAMA dengan KODE_ACARA di Code.gs dan absen.html
  const KODE_ACARA = 'GSD2026';

  const base = location.href.replace(/qr(\.html)?(\?.*)?$/, '');
  const link = base + 'absen.html?k=' + encodeURIComponent(KODE_ACARA);

  new QRCode(document.getElementById('qr'), { text: link, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('url').textContent = link;
</script>
</body>
</html>
